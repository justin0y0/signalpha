server {
  listen 80;
  server_name signalpha.app www.signalpha.app;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name signalpha.app www.signalpha.app;

  ssl_certificate /etc/letsencrypt/live/signalpha.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/signalpha.app/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # Docker's embedded DNS, with a short TTL. nginx resolves an upstream literal
    # ONCE at startup and caches it forever, so every `docker compose up -d --build
    # backend` handed the new container a new IP while nginx kept dialling the old
    # one -- the whole API returned 502 until the frontend was restarted too. Putting
    # the host in a variable forces per-request resolution through the resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_backend backend;
    proxy_pass http://$upstream_backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
