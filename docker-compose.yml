version: "3.9"

# Every container's json log was unbounded: the scheduler wrote 11 GB in 2.7 days of
# one scikit-learn warning per tree per prediction (fixed at the source too).
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: earnings
      POSTGRES_USER: earnings
      POSTGRES_PASSWORD: earnings
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earnings -d earnings"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # No log rotation here on purpose: changing this service recreates the container,
    # and redis has no volume (sessions, Oracle state and caches would be lost). Its
    # log is a few MB.
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    logging: *logging
    restart: unless-stopped
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://earnings:earnings@postgres:5432/earnings
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
      # inherited by joblib workers too (see backend/app/core/logging.py)
      PYTHONWARNINGS: "ignore:X has feature names:UserWarning,ignore:Skipping features without any observed values:UserWarning"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  scheduler:
    logging: *logging
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "data_pipeline.scheduler"]
    # 2026-10-27 the scheduler hit the default 1024 open files after a trading day
    # ("marks: [Errno 24] Too many open files"); fd_watch in scheduler.py logs what grows.
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://earnings:earnings@postgres:5432/earnings
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
      # inherited by joblib workers too (see backend/app/core/logging.py)
      PYTHONWARNINGS: "ignore:X has feature names:UserWarning,ignore:Skipping features without any observed values:UserWarning"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    logging: *logging
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /srv/edge-vhosts:/etc/nginx/extra:ro

volumes:
  postgres_data:
